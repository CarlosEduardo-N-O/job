services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: job_backend_prod
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - backend_storage:/var/www/storage
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - job_network

  postgres:
    image: postgres:17
    container_name: job_postgres_prod
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${DB_USERNAME} -d $${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - job_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: /api
    container_name: job_frontend_prod
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - job_network

  nginx:
    image: nginx:alpine
    container_name: job_nginx_prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
    networks:
      - job_network

volumes:
  postgres_data:
  backend_storage:

networks:
  job_network:
    driver: bridge
